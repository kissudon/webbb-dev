<html>
<head>
    <title>HTML Lists</title>
</head>
<body>

<h2>Ordered List</h2>

<ol>
    <li>C++</li>
    <li>HTML</li>
    <li>CSS</li>
</ol>

<h2>Unordered List</h2>

<ul>
    <li>Cricket</li>
    <li>Football</li>
    <li>Badminton</li>
</ul>

<h2>Description List</h2>

<dl>
    <dt>HTML</dt>
    <dd>Used to create web pages.</dd>

    <dt>CSS</dt>
    <dd>Used to design web pages.</dd>

    <dt>C++</dt>
    <dd>Programming language.</dd>
</dl>

</body>
</html>
